[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fatigue-qgis"
version = "0.1.0"
description = "압력 데이터의 주파수 성분을 분석하여 구조물의 피로 손상을 평가하는 시스템"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["fatigue", "damage", "analysis", "gis", "qgis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "geopandas>=0.14.0",
    "matplotlib>=3.5.0",
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "shapely>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mypy>=0.10.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "pydeps>=3.0.0",
]

[project.scripts]
read-gis = "src.main1_read_gis_files:main"
draw-zone = "src.main2_draw_zone:main"

[tool.setuptools]
packages = ["src", "src.analysis", "src.common"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
# Python 버전
python_version = "3.11"

# 엄격한 타입 검사 설정
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_any_unimported = false
disallow_subclassing_any = true
disallow_untyped_calls = true

# 경고 설정
warn_return_any = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

# 엄격한 옵션
strict_equality = true
extra_checks = true
check_untyped_defs = true
no_implicit_optional = true
no_implicit_reexport = true

# 오류 출력 설정
show_error_codes = true
show_column_numbers = true
pretty = true

# 제외할 디렉토리
exclude = [
    "tests/",
    "build/",
    "dist/",
]

# 서드파티 라이브러리 설정 (타입 스텁이 없는 경우 무시)
[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "numpy.*",
    "matplotlib.*",
    "scipy.*",
    "seaborn.*",
    "geopandas.*",
    "shapely.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Python 경로 설정
pythonpath = ["src"]

# 테스트 디렉토리
testpaths = ["tests"]

# 테스트 파일 패턴
python_files = ["test_*.py", "*_test.py"]

# 테스트 클래스 패턴
python_classes = ["Test*"]

# 테스트 함수 패턴
python_functions = ["test_*"]

# 최소 pytest 버전
minversion = "6.0"

# 추가 옵션
addopts = [
    "--verbose",
    "--tb=short",
    # "--strict-markers",  # Temporarily disabled for test compatibility
    "--disable-warnings",
    "--cov=src",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

# 커버리지 제외 패턴
[tool.coverage.run]
omit = [
    "*/analysis/*",
    "*/tests/*",
]

# 마커 정의
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "visualization: marks tests as visualization tests",
    "performance: marks tests as performance tests",
]

# 경고 필터
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# 활성화할 규칙들
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T10",  # flake8-debugger
    "EM",   # flake8-errmsg
    "ISC",  # flake8-implicit-str-concat
    "G",    # flake8-logging-format
    "PIE",  # flake8-pie
    "Q",    # flake8-quotes
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "TCH",  # flake8-type-checking
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific rules
]

# Black과 호환성을 위해 무시할 규칙
ignore = [
    "E203",   # Black과 호환성
    "E501",   # Line too long (black이 처리)
    "DTZ001", # datetime without tzinfo
    "DTZ005", # datetime.now() without tzinfo
    "N806",   # Variable name in function should be lowercase
    "N802",   # Function name should be lowercase (기존 코드 유지)
    "N999",   # Invalid module name (K_soil 등의 이름 허용)
    "EM101",  # Raw string in exception
    "EM102",  # f-string in exception
    "B007",   # Loop control variable not used (for 루프에서 언더스코어 사용 회피)
    "B904",   # raise from inside except
    "B019",   # Use of lru_cache on methods
    "C408",   # Unnecessary dict() call (matplotlib bbox 스타일)
    "C414",   # Unnecessary list() call in sorted()
    "B028",   # No explicit stacklevel in warning
]

# 파일별 규칙 예외
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # import 미사용 허용
"tests/*" = ["S101", "B018", "B011"]  # assert 사용 허용, 테스트 코드 특성상 무시

[tool.ruff.lint.isort]
known-first-party = ["src", "common", "analysis"]