[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True

# 점진적으로 strict 모드 적용
[mypy-src.common.validation]
strict = True

[mypy-src.common.file_utils]
strict = True

[mypy-src.common.error_handling]
strict = True

[mypy-src.common.logging_utils]
strict = True

# 외부 라이브러리 ignore
[mypy-pandas.*]
ignore_missing_imports = True

[mypy-geopandas.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-shapely.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True